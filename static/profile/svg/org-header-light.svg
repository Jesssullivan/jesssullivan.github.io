<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 182" width="960" height="182" role="img" aria-labelledby="org-header-light-t" aria-describedby="org-header-light-d"><title id="org-header-light-t">xoxd.ai</title><desc id="org-header-light-d">xoxd.ai: Bootstrapped engineering and contracting firm: infrastructure automation, build platforms, agent orchestration for semi-autonomous infrastructure lifecycle management, and full business stacks for clients. Building glorious.build, a cache-first build and CI substrate (Bazel remote cache and execution, Nix, pooled self-hosted runners); pre-launch.</desc><style>text{font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#000203}.t-title{font-size:20px;font-weight:700;fill:#005063}.t-sub{font-size:13px;fill:#3c4b4e}.t-cap{font-size:11.5px;fill:#3c4b4e;font-style:italic;font-family:'Crimson Pro', Georgia, 'Times New Roman', serif}.t-lab{font-size:12px;fill:#000203}.t-small{font-size:11px;fill:#3c4b4e}.t-hd{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#3c4b4e}.t-mono{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#3c4b4e}.rise{animation:rise 700ms cubic-bezier(.2,.8,.2,1) backwards}@keyframes rise{from{opacity:0;transform:translateY(8px)}}.fade{animation:fade 500ms ease-out backwards}@keyframes fade{from{opacity:0}}.rule{stroke:#007e9a;stroke-width:2;stroke-dasharray:1;animation:draw 700ms ease-out 300ms backwards}@keyframes draw{from{stroke-dashoffset:1}}.name{font-family:'Raleway', 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:32px;font-weight:700;fill:#005063}.line{font-size:14px;fill:#000203}.tag{font-size:13px;fill:#3c4b4e}@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}</style><rect x=".5" y=".5" width="959" height="181" fill="#ecf8fa" stroke="#ccdbdd"/><text x="28" y="56" class="name rise">xoxd.ai</text>
<path class="rule" pathLength="1" d="M28 70H148.1"/>
