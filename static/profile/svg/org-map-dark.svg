<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" role="img" aria-labelledby="org-map-dark-t" aria-describedby="org-map-dark-d"><title id="org-map-dark-t">Project map</title><desc id="org-map-dark-d">A map of xoxd.ai's public packages and tools, in full color, among the founder's other public repositories, dimmed; each is drawn as a marker whose color and shape give its claim category: Applied ML &amp; classification; Kernel, firmware &amp; security research; Compilers, HPC &amp; functional compute; Systems libraries &amp; tools; Build systems &amp; infrastructure; Software-lifecycle automation; Web product &amp; libraries; GIS, fabrication &amp; community. Nearby markers have similar README, description and topic text; the axes and the distances between groups carry no meaning. The full list is in the Data table under the image.</desc><style>text{font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#ecf8fa}.t-title{font-size:20px;font-weight:700;fill:#91dbf2}.t-sub{font-size:13px;fill:#91a2a5}.t-cap{font-size:11.5px;fill:#91a2a5;font-style:italic;font-family:'Crimson Pro', Georgia, 'Times New Roman', serif}.t-lab{font-size:12px;fill:#ecf8fa}.t-small{font-size:11px;fill:#91a2a5}.t-hd{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#91a2a5}.t-mono{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#91a2a5}.pt{stroke:#ecf8fa;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pt-in 900ms cubic-bezier(.2,.8,.2,1) backwards}@keyframes pt-in{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}.dim{opacity:.28}.sw{stroke:#ecf8fa;stroke-width:1}.fade{animation:fade 600ms ease-out backwards}@keyframes fade{from{opacity:0}}.rise{animation:rise 600ms ease-out backwards}@keyframes rise{from{opacity:0;transform:translateY(6px)}}.ld{fill:none;stroke:#91a2a5;stroke-width:1;stroke-dasharray:1;animation:draw 500ms ease-out backwards}@keyframes draw{from{stroke-dashoffset:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}</style><rect x=".5" y=".5" width="959" height="739" fill="#020708" stroke="#1f2b2e"/><text x="24" y="38" class="t-title">Project map</text>
<text x="24" y="60" class="t-sub">Public packages and tools, placed by the text of their READMEs, descriptions and topics.</text>
