<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="upstream-light-960-title" aria-describedby="upstream-light-960-desc"><title id="upstream-light-960-title">Merged upstream work</title><desc id="upstream-light-960-desc">Independent external projects with verified merged pull requests. Every project is marked once at its exact latest-merge date on one horizontal axis. Fixed-size circles and diamonds distinguish contributor and committer relationships. Vertical offsets only separate overlapping marks and annotations. Selected labels keep the diagram legible; the linked table contains every project and date. The horizontal axis encodes recency; contribution depth is not measured. The newest merge mark may pulse briefly; the static chart is complete without motion.</desc><style>text{font-variant-numeric:tabular-nums}@keyframes ribbon-pulse{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}.ribbon-pulse{opacity:0;transform-box:fill-box;transform-origin:center;animation:ribbon-pulse 1.8s ease-out .6s 3}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><rect x=".5" y=".5" width="959" height="483" fill="#f7f3fc" stroke="#dad5e0"/><text x="32" y="43" font-size="22" font-family="&apos;FiraCode Nerd Font Mono&apos;, &apos;SFMono-Regular&apos;, Menlo, Consolas, monospace" font-weight="600" fill="#69001a" text-anchor="start">Merged upstream work</text>
