name: Cloudflare Pages Production Deploy

# This lane IS the production deploy for transscendsurvival.org (Cloudflare
# Pages project transscendsurvival-org). The historical pull_request "shadow"
# trigger is retired: PR iteration happens on the tailnet shadow route via
# shadow-preview.yml, and the build-only PR pass here produced misleading
# green "shadow" checks with can_deploy=false.
on:
  workflow_dispatch:
    inputs:
      require_deploy:
        description: "Fail instead of skipping when Cloudflare credentials are missing"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages-shadow.yml"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - "scripts/**"
      - "src/**"
      - "static/**"

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'transscendsurvival-org' }}

jobs:
  production-deploy:
    name: Build and optionally deploy Cloudflare Pages production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx tsx scripts/validate-redirects.mts
      - run: npx tsx scripts/validate-directory-index-aliases.mts

      - name: Resolve Cloudflare deploy eligibility
        id: cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REQUIRE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.require_deploy || 'false' }}
        run: |
          deploy_branch="${GITHUB_REF_NAME}"
          can_deploy=true
          missing=()

          if [ -z "${CF_ACCOUNT_ID}" ]; then
            can_deploy=false
            missing+=("CLOUDFLARE_ACCOUNT_ID")
          fi

          if [ -z "${CF_API_TOKEN}" ]; then
            can_deploy=false
            missing+=("CLOUDFLARE_API_TOKEN")
          fi

          if [ "${can_deploy}" != "true" ] && [ "${#missing[@]}" -gt 0 ]; then
            message="Missing Cloudflare secrets: ${missing[*]}"
            if [ "${REQUIRE_DEPLOY}" = "true" ]; then
              echo "::error title=Cloudflare production deploy blocked::${message}"
              exit 1
            fi
            echo "::notice title=Cloudflare production deploy skipped::${message}"
          fi

          {
            echo "can_deploy=${can_deploy}"
            echo "branch=${deploy_branch}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Cloudflare Pages Production"
            echo ""
            echo "- Project: \`${CLOUDFLARE_PAGES_PROJECT_NAME}\`"
            echo "- Branch: \`${deploy_branch}\`"
            echo "- Deploy enabled: \`${can_deploy}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production build to Cloudflare Pages
        if: steps.cloudflare.outputs.can_deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.95.0"
          command: pages deploy build --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ steps.cloudflare.outputs.branch }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
