name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Substrate-boundary conformance (TIN-2423 / ledger item 30), ported from
  # the GloriousFlywheel reference implementation (GF PR #1016). Stdlib-only
  # Python — no Node/Bazel setup needed. Asserts this repo's CODE surfaces
  # reach the blahaj substrate only through the named, provenance-carrying
  # interfaces recorded in config/substrate-boundary-allowlist.json.
  substrate-boundary:
    name: substrate-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate substrate boundary
        run: |
          python3 scripts/validate-substrate-boundary.py --self-test
          python3 scripts/validate-substrate-boundary.py

  # TIN-8703: this job is the blog's Bazel gate. It now runs every target on
  # the repository's own runner with local Bazel execution: no remote cache,
  # no remote executor, no token and no credential helper. The name still
  # says "remote" only because branch protection requires a check with this
  # exact name. Renaming it is a later step that needs a branch protection
  # change.
  bazel-remote-gates:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Per-ref dedupe only: a newer push to the same ref supersedes its own
    # stale gates run without canceling unrelated pull requests.
    concurrency:
      group: blog-local-gate-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: tinyland-dind
    # A cold run builds the whole public graph on a small runner with an empty
    # Bazel cache. Warm runs restore the disk cache and finish much sooner.
    timeout-minutes: 120
    env:
      # The runner pod may still inject old remote endpoints. Clear them so a
      # stale value cannot route the build. scripts/local-bazel-gate.sh also
      # unsets every BAZEL_REMOTE_*, GF_REAPI_* and GF_BAZEL_* variable.
      BAZEL_REMOTE_CACHE: ''
      BAZEL_REMOTE_EXECUTOR: ''
      BAZEL_REMOTE_EXECUTOR_CACHE: ''
      BAZEL_REMOTE_INSTANCE_NAME: ''
      GF_BAZEL_SUBSTRATE_MODE: ''
      BLOG_GATE_JOBS: '2'
      BLOG_GATE_JVM_HEAP_MB: '2048'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report runner resources
        run: |
          echo "nproc: $(nproc)"
          # nproc and free show the node. The pod limit lives in the cgroup
          # (v2 first, then v1).
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.max \
            /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/cpu/cpu.cfs_quota_us; do
            if [ -r "${f}" ]; then echo "${f}: $(cat "${f}")"; fi
          done
          free -m || true
          df -h "${GITHUB_WORKSPACE}" || true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Provision package-lock-pinned Chromium
        run: |
          set -euo pipefail
          # Install the revision pinned by @playwright/test outside Bazel,
          # then pass its absolute path into browser tests.
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          chromium_path="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          if [[ "${chromium_path}" != /* || ! -x "${chromium_path}" ]]; then
            echo "::error::Playwright Chromium resolution produced an unusable path"
            exit 1
          fi
          echo "GF_RBE_CHROMIUM_EXECUTABLE=${chromium_path}" >> "${GITHUB_ENV}"

      - name: Cache Bazelisk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/bazelisk
          key: bazelisk-${{ runner.os }}-${{ hashFiles('.bazelversion') }}

      # Content-addressed Bazel disk and repository caches. A stale entry is
      # safe: Bazel keys every action by its inputs. Keyed on the lockfiles so
      # dependency actions stay warm; source actions rebuild as needed.
      - name: Cache Bazel disk and repository caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/bazel-blog-gate
          key: blog-local-gate-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'package-lock.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            blog-local-gate-${{ runner.os }}-

      - name: Install bazelisk
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 \
            -fsSL https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 \
            -o "${tmp}"
          chmod +x "${tmp}"
          if [ -w /usr/local/bin ]; then
            mv "${tmp}" /usr/local/bin/bazel
          else
            sudo mv "${tmp}" /usr/local/bin/bazel
          fi

      - name: Local check
        run: |
          npm run gate:check
          bash scripts/local-bazel-gate.sh shutdown

      - name: Local test
        run: |
          npm run gate:test
          bash scripts/local-bazel-gate.sh shutdown

      - name: Local e2e
        run: |
          npm run gate:e2e
          bash scripts/local-bazel-gate.sh shutdown

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 \
            -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Detect secrets with gitleaks
        run: gitleaks detect --source . --no-banner --redact --verbose

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Static production dependency audit
        run: npm run security:audit:static

      - name: Restore SvelteKit build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .svelte-kit
          key: sveltekit-${{ runner.os }}-${{ hashFiles('svelte.config.js', 'vite.config.ts', 'src/**') }}
          restore-keys: |
            sveltekit-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: Test authority
        run: |
          echo "check/test/e2e are intentionally owned by bazel-remote-gates."
          echo "That job runs gate:check, gate:test and gate:e2e with local Bazel on the blog's own runner."

      - name: Blog agent production dependency audit (report-only)
        run: |
          set +e
          npm run security:audit:blog-agent
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "## Blog agent production dependency audit"
              echo ""
              echo "Report-only audit exited with status $status."
              echo "Keeping this informational so build-and-test stays visually green while test authority remains in bazel-remote-gates."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Build
        run: npm run build

      - name: Bundle size report
        run: npx tsx scripts/report-bundle-size.mts

      - name: Lighthouse CI
        id: lhci
        timeout-minutes: 5
        run: |
          timeout 5m bash -lc 'npm install -g @lhci/cli && lhci autorun'
        continue-on-error: true

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

      - name: CI Summary
        if: always()
        run: |
          {
            echo "## CI Results"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const fs = require('fs');
            const path = require('path');
            const lines = [];

            // Bundle sizes
            const buildDir = path.join('build', '_app', 'immutable');
            let totalJS = 0, totalCSS = 0, jsCount = 0, cssCount = 0;
            function walk(dir) {
              try {
                for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, e.name);
                  if (e.isDirectory()) { walk(full); continue; }
                  const size = fs.statSync(full).size;
                  if (e.name.endsWith('.js') || e.name.endsWith('.mjs')) { totalJS += size; jsCount++; }
                  else if (e.name.endsWith('.css')) { totalCSS += size; cssCount++; }
                }
              } catch {}
            }
            walk(buildDir);
            const fmt = (b) => b < 1024 ? b + ' B' : (b/1024).toFixed(1) + ' KB';
            lines.push('### Bundle Size');
            lines.push('| Type | Size | Files |');
            lines.push('|------|------|-------|');
            lines.push('| JS | ' + fmt(totalJS) + ' | ' + jsCount + ' |');
            lines.push('| CSS | ' + fmt(totalCSS) + ' | ' + cssCount + ' |');
            lines.push('| **Total** | **' + fmt(totalJS + totalCSS) + '** | ' + (jsCount + cssCount) + ' |');
            lines.push('');

            // Lighthouse scores
            try {
              const lhDir = '.lighthouseci';
              const jsonFiles = fs.readdirSync(lhDir).filter(f => f.endsWith('.json') && f.startsWith('lhr-'));
              if (jsonFiles.length > 0) {
                lines.push('### Lighthouse Scores');
                lines.push('| Page | Perf | A11y | Best Practices | SEO |');
                lines.push('|------|------|------|----------------|-----|');
                for (const f of jsonFiles) {
                  const lhr = JSON.parse(fs.readFileSync(path.join(lhDir, f), 'utf-8'));
                  const url = new URL(lhr.requestedUrl || lhr.finalUrl).pathname;
                  const s = (cat) => Math.round((lhr.categories[cat]?.score || 0) * 100);
                  lines.push('| ' + url + ' | ' + s('performance') + ' | ' + s('accessibility') + ' | ' + s('best-practices') + ' | ' + s('seo') + ' |');
                }
                lines.push('');
              }
            } catch {}

            console.log(lines.join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
