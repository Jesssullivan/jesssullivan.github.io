name: Validate Blog Dates

on:
  pull_request:
    branches: [main]
    paths: ['src/posts/**']

permissions:
  contents: read
  pull-requests: read

jobs:
  check-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Validate future-dated posts
        env:
          BASE_BRANCH: origin/${{ github.base_ref }}
        run: npx tsx scripts/validate-blog-dates.mts
