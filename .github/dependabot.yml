version: 2
updates:
  # package-lock.json is the npm authority. pnpm-lock.yaml is the generated
  # rules_js lock (regenerate with pnpm 9.15.9 --lockfile-only); a Dependabot
  # npm PR updates package-lock.json only and needs that regeneration before
  # bazel-remote-gates can pass.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 5
    ignore:
      # RU5 (2026-10-08): the estate stack is pinned exactly and moves only with
      # the estate version manifest (site.scaffold SSOT), never per spoke:
      # Svelte, Kit, Vite, TypeScript (+ the @typescript/typescript6 API companion),
      # vitest, Playwright, Skeleton and Effect.
      - dependency-name: 'svelte'
      - dependency-name: '@sveltejs/kit'
      - dependency-name: 'vite'
      - dependency-name: 'typescript'
      - dependency-name: '@typescript/typescript6'
      # Patched dependencies (patches/, RU13) move only with their patch.
      - dependency-name: 'svelte-check'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
      - dependency-name: '@playwright/test'
      - dependency-name: '@skeletonlabs/*'
      - dependency-name: 'effect'
      # In-house packages reach the Bazel graph through bazel_dep registry
      # modules (RU6/RU9); their npm-rail specifiers move with MODULE.bazel.
      - dependency-name: '@tummycrypt/*'
      # Remaining framework majors move with the estate (TIN-3692 DB6 / DB21).
      - dependency-name: '@sveltejs/*'
        update-types:
          - 'version-update:semver-major'
    groups:
      # RU5: one grouped weekly PR for every remaining (ranged) dependency.
      weekly:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 5
    ignore:
      # ci-templates majors are an estate re-pin decision, not a Dependabot bump
      # (TIN-3692 DB6 / SC13).
      - dependency-name: 'xoxd-ai/ci-templates*'
        update-types:
          - 'version-update:semver-major'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
